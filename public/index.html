<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALLASKA CRM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-logo">
        <span class="logo-diamond">◈</span>
        <div class="logo-text-group">
          <span class="logo-name">ALLASKA</span>
          <span class="logo-badge">CRM</span>
        </div>
      </div>

      <div class="sidebar-section">FERRAMENTAS</div>
      <nav id="tools-nav">
        <div class="tool-row" data-tool="prospeccao" data-port="5000">
          <a class="tool-link" href="http://localhost:5000" target="_blank">
            <span class="tool-dot" id="dot-prospeccao"></span>
            <span class="tool-name">Prospecção</span>
          </a>
          <button class="tool-launch" data-tool="prospeccao" title="Iniciar ferramenta">▶</button>
        </div>
        <div class="tool-row" data-tool="rastreamento" data-port="5001">
          <a class="tool-link" href="http://localhost:5001" target="_blank">
            <span class="tool-dot" id="dot-rastreamento"></span>
            <span class="tool-name">Rastreamento</span>
          </a>
          <button class="tool-launch" data-tool="rastreamento" title="Iniciar ferramenta">▶</button>
        </div>
        <div class="tool-row" data-tool="proposta" data-port="5002">
          <a class="tool-link" href="http://localhost:5002" target="_blank">
            <span class="tool-dot" id="dot-proposta"></span>
            <span class="tool-name">Gerar Proposta</span>
          </a>
          <button class="tool-launch" data-tool="proposta" title="Iniciar ferramenta">▶</button>
        </div>
        <div class="tool-row" data-tool="avaliacao" data-port="5003">
          <a class="tool-link" href="http://localhost:5003" target="_blank">
            <span class="tool-dot" id="dot-avaliacao"></span>
            <span class="tool-name">Gerar Avaliação</span>
          </a>
          <button class="tool-launch" data-tool="avaliacao" title="Iniciar ferramenta">▶</button>
        </div>
        <div class="tool-row" data-tool="carrossel" data-port="5004">
          <a class="tool-link" href="http://localhost:5004" target="_blank">
            <span class="tool-dot" id="dot-carrossel"></span>
            <span class="tool-name">Gerar Carrossel</span>
          </a>
          <button class="tool-launch" data-tool="carrossel" title="Iniciar ferramenta">▶</button>
        </div>
        <div class="tool-row" data-tool="monitor" data-port="5005">
          <a class="tool-link" href="http://localhost:5005" target="_blank">
            <span class="tool-dot" id="dot-monitor"></span>
            <span class="tool-name">Monitor Reputação</span>
          </a>
          <button class="tool-launch" data-tool="monitor" title="Iniciar ferramenta">▶</button>
        </div>
      </nav>

      <div class="sidebar-spacer"></div>

      <div class="sidebar-section">ESTATÍSTICAS</div>
      <div id="stats">
        <div class="stat-item">
          <span class="stat-label">Leads ativos</span>
          <span class="stat-value" id="stat-ativos">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Em negociação</span>
          <span class="stat-value stat-yellow" id="stat-nego">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Fechados</span>
          <span class="stat-value stat-green" id="stat-fechados">0</span>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main id="main">
      <header id="top-bar">
        <div class="topbar-left">
          <h1>Pipeline de Vendas</h1>
          <span id="total-badge">0 leads</span>
        </div>
        <div class="topbar-right">
          <div class="search-wrap">
            <span class="search-icon">⌕</span>
            <input type="text" id="search" placeholder="Buscar cliente...">
          </div>
          <button class="btn-primary" id="btn-novo">+ Novo Lead</button>
        </div>
      </header>

      <div id="kanban"></div>
    </main>
  </div>

  <!-- Modal -->
  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <div class="modal-header">
        <h2 id="modal-title">Novo Lead</h2>
        <button class="modal-close" id="modal-close">×</button>
      </div>
      <form id="modal-form">
        <div class="form-row">
          <div class="form-group">
            <label>Nome do contato <span class="required">*</span></label>
            <input type="text" id="f-nome" required placeholder="João Silva">
          </div>
          <div class="form-group">
            <label>Empresa</label>
            <input type="text" id="f-empresa" placeholder="Empresa XYZ">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Telefone</label>
            <input type="text" id="f-telefone" placeholder="(11) 99999-9999">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="f-email" placeholder="email@empresa.com">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Valor estimado</label>
            <input type="text" id="f-valor" placeholder="R$ 2.500">
          </div>
          <div class="form-group">
            <label>Coluna</label>
            <select id="f-coluna">
              <option value="lead">Lead</option>
              <option value="contato">Contato feito</option>
              <option value="proposta">Proposta enviada</option>
              <option value="negociando">Negociando</option>
              <option value="fechado">Fechado</option>
              <option value="perdido">Perdido</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Notas</label>
          <textarea id="f-notas" rows="3" placeholder="Informações adicionais, histórico, observações..."></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" id="btn-cancelar">Cancelar</button>
          <button type="submit" class="btn-primary" id="btn-salvar">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
